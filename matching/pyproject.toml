[project]
name = "tenth"
version = "0.1.0"
description = "Tenth matching service"
requires-python = ">=3.12,<3.13"   # same minor version as the Dockerfile and the environment that trained the models
dependencies = [
    # Pin the model-related packages to the versions in the environment that trained the models
    # (run: pip freeze | grep -iE "^(scikit-learn|lightgbm|joblib|numpy|pandas|pyarrow|sentence-transformers|openpyxl|torch)==")
    # then write them as e.g. "scikit-learn==1.5.2". Model pickles break silently across versions.
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "openpyxl==3.1.5",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",  
    "joblib==1.6.0",
    "rapidfuzz==3.14.6",
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
    "fastapi",
    "uvicorn[standard]",
]

[tool.uv]
package = false   # an application, not a library: install the dependencies only

# CPU-only torch keeps the image around 2 GB instead of 8 GB. macOS gets the normal wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true